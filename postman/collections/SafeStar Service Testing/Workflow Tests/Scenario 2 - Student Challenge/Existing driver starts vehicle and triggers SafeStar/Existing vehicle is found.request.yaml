$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      const qa_workshop_package = pm.require('@postvehicle-enterprise-team-2b1c89a1-7156-483f-b7a7-431c7a81/qa_workshop_package');
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("VIN is valid", function () {
              pm.expect(qa_workshop_package.isValidVIN(jsonData.vehicle.vin)).to.be.true;
       
      });
    language: text/javascript
    packages:
      "@postvehicle-enterprise-team-2b1c89a1-7156-483f-b7a7-431c7a81/qa_workshop_package":
        id: 01a1a712-f0b7-7199-bdfe-1d4a8a25500b
order: 2000
